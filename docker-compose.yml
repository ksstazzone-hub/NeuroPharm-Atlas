services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neuropharm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuropharm}
      POSTGRES_DB: ${POSTGRES_DB:-neuropharm}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - neuropharm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neuropharm} -d ${POSTGRES_DB:-neuropharm}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  neuropharm_postgres: